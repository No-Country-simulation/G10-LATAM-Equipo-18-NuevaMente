[project]
name = "nuevamente-backend"
version = "0.1.0"
description = "NuevaMente — Backend de Adaptación Educativa Inteligente"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.141.0,<1.0.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    # ── Data validation ────────────────────────────────────────────────────────
    "pydantic>=2.13.0,<3.0.0",
    # ── Environment ───────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    # ── Google AI SDK (v2 — replaces google-generativeai) ─────────────────────
    "google-genai>=2.24.0,<3.0.0",
    # ── LangChain + Gemini integration ────────────────────────────────────────
    "langchain>=1.0.0,<2.0.0",
    "langchain-google-genai>=4.4.0,<5.0.0",
    "langgraph>=1.2.0,<2.0.0",
    # ── Embeddings (local fallback) ────────────────────────────────────────────
    "sentence-transformers>=6.1.0",
    "numpy>=1.26",
    # ── Vector store ──────────────────────────────────────────────────────────
    "faiss-cpu>=1.15.0",
    # ── RAG / retrieval ───────────────────────────────────────────────────────
    "rank-bm25>=0.2.2",
    "networkx>=3.2.1",
    # ── Document parsing ──────────────────────────────────────────────────────
    "pypdf>=5.0",
    "pymupdf4llm>=0.0.17",
    # ── HTTP client for Jina embeddings (jina_client.py) ───────────────────────
    "requests>=2.31.0",
    # ── OCI Object Storage ────────────────────────────────────────────────────
    "oci>=2.120.0",
    "cohere>=7.1.1",
    "groq>=0.11.0",
    "keybert>=0.9.0",
    # ── Supabase (storage + future auth/pgvector) ──────────────────────────────
    "supabase>=2.31.0",
]

[tool.uv]
# Not a library — no wheel is built or installed.
package = false

[tool.pytest.ini_options]
# Tests live in backend/tests/ — no src/ layout.
pythonpath = ["."]
